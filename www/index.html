<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#6457a6"><title>Вікторія DinLova · Майстер-класи 4.0</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#242137;background:#f7f5fb}*{box-sizing:border-box}body{margin:0}header{background:#6457a6;color:white;padding:22px 18px 16px}header h1{font-size:23px;margin:0 0 5px}header small{opacity:.9}main{max-width:950px;margin:auto;padding:16px 16px 100px}.nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;box-shadow:0 -3px 18px #0002;padding:7px}.nav button{font-size:13px;border:0;background:transparent;padding:12px 7px;color:#514987}.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 15px #2d225510}.muted{color:#746e82}h2{font-size:21px}h3{font-size:17px}.pill{display:inline-block;background:#eeeafb;color:#554a8e;padding:4px 8px;border-radius:12px;font-size:12px}.btn,button.action{border:0;border-radius:12px;background:#6457a6;color:white;font-weight:600;padding:12px 15px;margin:5px 5px 5px 0;cursor:pointer}button.alt{background:#eceaf8;color:#41376d}button.outline{background:white;color:#41376d;border:1px solid #d4d0e8}progress{width:100%;height:14px;accent-color:#6457a6}input,select,textarea{border:1px solid #d6d2e5;border-radius:10px;padding:11px;font:inherit;max-width:100%}.lesson{width:100%;text-align:left;background:#fff;border:1px solid #e3dfed;border-radius:12px;padding:14px;margin:5px 0;color:#2a253a}.lesson b{display:block}.answers button{display:block;background:#f2eff9;border:1px solid #ddd4f5;border-radius:11px;padding:12px;width:100%;text-align:left;margin:8px 0;color:#292338}.answers button.selected{background:#d5c9fa;border:2px solid #6652a5}canvas{width:100%;height:auto;touch-action:none;background:white;border:1px solid #ddd;border-radius:12px;display:block}.palette{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.swatch{width:36px;height:36px;border:2px solid white;box-shadow:0 0 0 1px #9996;border-radius:50%;padding:0;margin:0}.swatch.active{box-shadow:0 0 0 3px #6652a5}img.work{max-width:100%;border-radius:9px;border:1px solid #ddd}label{display:block;margin:10px 0 5px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}@media(min-width:700px){.two{grid-template-columns:repeat(3,minmax(0,1fr))}} .hidden{display:none}</style><link rel="stylesheet" href="enhanced.css"><link rel="stylesheet" href="curriculum.css"><link rel="stylesheet" href="atelier-v3.css"><link rel="stylesheet" href="deep-lessons.css"></head><body><header><div class="brand-mark"><span class="brand-logo">V</span><span><h1>Вікторія DinLova</h1><small>Мистецька студія · майстер-класи 4.0</small></span></div></header><main id="app"></main><nav class="nav"><button onclick="tab('lessons')">Уроки</button><button onclick="tab('studio')">Майстерня</button><button onclick="tab('gallery')">Галерея</button><button onclick="tab('parent')">Батькам</button></nav><script>
const content=[
["Історія мистецтва","Перші зображення","Люди створювали малюнки задовго до появи фотоапаратів. Печерні малюнки розповідають про тварин і життя давніх спільнот.","Намалюй історію без слів.","Для чого люди створювали малюнки?",["Щоб передати ідеї та історії","Лише щоб прикрасити телефони","Щоб створювати фотографії"],0],
["Історія мистецтва","Від античності до Відродження","Художники вивчали пропорції та простір. У Відродження лінійна перспектива допомогла зображати глибину на площині.","Намалюй дорогу, що віддаляється.","Що допомагає показати глибину?",["Лінійна перспектива","Гучний звук","Тільки чорний колір"],0],
["Історія мистецтва","Що таке дизайн?","Дизайн поєднує красу, зручність і призначення. Гарно спроєктований предмет не лише приваблює, а й допомагає людині.","Придумай зручний значок для програми.","Що важливо в дизайні?",["Лише дорогий матеріал","Краса і користь","Випадковий набір форм"],1],
["Історія мистецтва","Баугауз і сучасний дизайн","Школа Баугауз виникла в Німеччині 1919 року. Її митці експериментували з простими формами, матеріалами та поєднанням мистецтва з ремеслом.","Створи композицію з кіл, квадратів і трикутників.","Які форми можна використати?",["Лише складні візерунки","Прості геометричні","Тільки фотографії"],1],
["Візуальна грамотність","Композиція","Композиція — розміщення елементів у зображенні. Ми обираємо, де буде головний об'єкт і як погляд рухатиметься малюнком.","Створи малюнок з одним головним об'єктом.","Що таке композиція?",["Спосіб розміщення елементів","Назва камери","Кількість фарб"],0],
["Візуальна грамотність","Колірне коло","Основні для шкільного малювання кольори — червоний, жовтий і синій. Колірні поєднання можуть створювати гармонію або контраст.","Намалюй дві різні колірні палітри.","Які кольори часто називають теплими?",["Сині та блакитні","Червоні й помаранчеві","Тільки сірі"],1],
["Візуальна грамотність","Світло і тінь","Світло допомагає бачити форму й об'єм. Тіні підказують, де розміщене джерело світла, та створюють настрій.","Намалюй яблуко з тінню.","Що допомагає показати об'єм?",["Тінь і світло","Гучність","Заголовок"],0],
["Візуальна грамотність","Лінії та ритм","Повторення форм і ліній створює візуальний ритм. Лінії можуть спрямовувати увагу глядача.","Створи візерунок із повторенням.","Що таке візуальний ритм?",["Повторення елементів","Швидкість фото","Музика у відео"],0],
["Фотографія","Як народилась фотографія","Камера-обскура проєктує зображення завдяки світлу. Перші стійкі фотографії були створені в XIX столітті.","Намалюй власну камеру-обскуру.","Що потрібно для фотографії?",["Світло","Тільки олівець","Тільки музика"],0],
["Фотографія","Фотографія розповідає історії","Фотографії можуть документувати події, виражати почуття та зберігати сімейні спогади. Кожен кадр — це вибір автора.","Створи фотоісторію з трьох кадрів.","Що може передавати фотографія?",["Лише числа","Історію та настрій","Тільки звук"],1],
["Фотографія","Як працює камера","Світло проходить через об'єктив і потрапляє на сенсор. Фокус і експозиція впливають на чіткість та яскравість знімка.","Зроби два фото з різною яскравістю.","Що регулює експозиція?",["Яскравість","Колір корпусу","Розмір екрана"],0],
["Фотографія","Ракурс і масштаб","Крупний план підкреслює деталь, загальний план показує оточення. Ракурс змінює спосіб, у який ми бачимо предмет.","Зніми об'єкт згори, знизу і збоку.","Що таке ракурс?",["Кут зйомки","Час доби","Марка телефону"],0],
["iPhone та Android","Знайомство з камерою","Сітка допомагає вирівнювати кадр. Натискання на екран задає точку фокусування на багатьох телефонах.","Знайди сітку камери та зроби три кадри.","Навіщо потрібна сітка?",["Щоб вирівнювати композицію","Щоб стирати фотографії","Щоб записувати звук"],0],
["iPhone та Android","Портрет, природа, предмети","Під час фотографування звертай увагу на фон, світло й те, що хочеш розповісти. Не фотографуй незнайомих людей без дозволу.","Створи безпечний натюрморт із трьох речей.","Що варто перевірити перед фото?",["Фон і освітлення","Лише батарею","Тільки назву файла"],0],
["iPhone та Android","Обробка фотографій","Кадрування прибирає зайве. Редагування світла й кольору може покращити знімок, але не завжди потрібен сильний фільтр.","Порівняй вихідне і відредаговане фото.","Що робить кадрування?",["Прибирає зайві краї кадру","Ремонтує об'єктив","Додає звук"],0],
["iPhone та Android","Моя фотовиставка","Серія фотографій об'єднується ідеєю. Вибери головну тему, послідовність і назву своєї маленької виставки.","Створи серію «Мій улюблений колір».","Що об'єднує фотосерію?",["Спільна тема","Однаковий розмір телефона","Випадковий вибір"],0],
["Основи дизайну","Мова форм","Коло, квадрат, трикутник і вільні форми створюють різні враження. Важливо, як вони взаємодіють і яку мають роль.","Створи афішу з трьох форм.","З чого починається композиція?",["З вибору елементів і мети","З випадкових кнопок","З кількості пристроїв"],0],
["Основи дизайну","Пропорції та рівновага","Розміри і відстані між об'єктами змінюють враження. Рівновага не обов'язково означає симетрію.","Намалюй симетричну й асиметричну композиції.","Чи завжди рівновага симетрична?",["Так","Ні","Лише на фото"],1],
["Основи дизайну","Вільний простір","Порожній простір допомагає виділити головне. Не потрібно заповнювати деталями кожен куточок.","Намалюй мінімалістичну листівку.","Для чого потрібне вільне місце?",["Щоб підкреслити важливе","Щоб приховати помилку","Щоб усе було дрібним"],0],
["Основи дизайну","Шрифт та читабельність","Літери теж мають форму і характер. Добрий дизайн допомагає легко прочитати важливий текст.","Створи обкладинку книги з великим заголовком.","Що важливе для шрифту?",["Читабельність","Лише незвичайність","Максимум прикрас"],0],
["Основи дизайну","Поєднання кольорів","Занадто багато кольорів може відволікати. Обмежена палітра допомагає об'єднати різні елементи.","Створи постер лише з трьох кольорів.","Що таке палітра?",["Набір кольорів","Тип камери","Лінійка"],0],
["Основи дизайну","Мій власний стиль","Стиль — послідовність творчих рішень, які відображають ідею автора. Він змінюється, коли людина відкриває нові способи бачити світ.","Намалюй авторську обкладинку портфоліо.","Чи може стиль змінюватись?",["Так, з досвідом","Ні, ніколи","Лише щороку"],0]
];
const K="mystetstvo-v1", initial={done:{},grades:{},tests:{},works:[],notes:""};let data;try{data=Object.assign({},initial,JSON.parse(localStorage.getItem(K)||"{}"))}catch(e){data={...initial}}let current=-1,selection=null,ctx,canvas,drawing=false,last=null,color="#6457a6",size=5;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(data));}catch(e){alert("Місця для збереження замало. Збережіть резервну копію.")}};const esc=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function tab(name){current=-1;const el=document.getElementById("app");if(name==="lessons"){let done=Object.keys(data.done).length;el.innerHTML='<div class="card"><h2>Мої заняття</h2><div class="muted">Пройдено '+done+' із '+content.length+'</div><progress max="'+content.length+'" value="'+done+'"></progress></div>';let group="";content.forEach((l,i)=>{if(l[0]!==group){group=l[0];el.innerHTML+='<h2>'+esc(group)+'</h2>'}el.innerHTML+='<button class="lesson" onclick="lesson('+i+')"><b>'+(data.done[i]?"✓ ":"")+(i+1)+'. '+esc(l[1])+'</b><span class="muted">'+(data.tests[i]!==undefined?"Тест: "+data.tests[i]+"/1 • ":"")+(data.grades[i]?"Оцінка: "+data.grades[i]+"/12":"Творче завдання")+'</span></button>'})}else if(name==="studio"){el.innerHTML='<div class="card"><h2>Майстерня S Pen</h2><p>Малюй стилусом або пальцем. Робота автоматично потрапить у галерею після збереження.</p><label>Назва роботи</label><input id="workname" value="'+esc(current>=0?content[current][1]:"Моя робота")+'" style="width:100%"><div class="palette" id="colors"></div><label>Товщина пензля <input id="width" type="range" min="1" max="30" value="5"></label><canvas id="paint" width="900" height="650"></canvas><button class="btn" onclick="storeWork()">Зберегти роботу</button><button class="action alt" onclick="undo()">Скасувати штрих</button><button class="action outline" onclick="clearPaint()">Очистити</button></div>';setupPaint()}else if(name==="gallery"){el.innerHTML='<h2>Моя галерея</h2>'+(data.works.length?'':'<div class="card">Тут будуть збережені роботи.</div>');data.works.forEach((w,i)=>el.innerHTML+='<div class="card"><h3>'+esc(w.name)+'</h3><img class="work" src="'+w.image+'"><p class="muted">'+esc(w.date)+'</p><button class="action alt" onclick="downloadWork('+i+')">Завантажити зображення</button></div>')}else if(name==="parent"){let n=Object.keys(data.done).length,t=Object.values(data.tests),avg=t.length?t.reduce((a,b)=>a+b,0)/t.length*100:0;el.innerHTML='<h2>Батьківський кабінет</h2><div class="two"><div class="card"><h3>Уроки</h3><b>'+n+' / 22</b></div><div class="card"><h3>Тести</h3><b>'+Math.round(avg)+'% правильних</b></div><div class="card"><h3>Роботи</h3><b>'+data.works.length+'</b></div></div><div class="card"><h3>Оцінки творчих робіт</h3>'+content.map((l,i)=>'<div style="padding:7px;border-bottom:1px solid #eee">'+(i+1)+'. '+esc(l[1])+' <select onchange="grade('+i+',this.value)"><option value="">Без оцінки</option>'+Array.from({length:12},(_,n)=>'<option value="'+(n+1)+'" '+(data.grades[i]==n+1?'selected':'')+'>'+(n+1)+'/12</option>').join('')+'</select></div>').join('')+'</div><div class="card"><h3>Нотатки батьків</h3><textarea id="notes" rows="5" style="width:100%">'+esc(data.notes||"")+'</textarea><button class="btn" onclick="data.notes=document.getElementById(\'notes\').value;save();alert(\'Нотатку збережено\')">Зберегти нотатки</button></div><div class="card"><h3>Резервна копія</h3><p class="muted">Прогрес зберігається на планшеті. Регулярно експортуйте резервну копію — вона включає і малюнки.</p><button class="btn" onclick="backup()">Експортувати прогрес</button><label>Відновлення даних із копії</label><input type="file" accept=".json,application/json" onchange="restore(event)"></div>'}};
function lesson(i){current=i;selection=null;let l=content[i];document.getElementById("app").innerHTML='<div class="card"><button class="action alt" onclick="tab(\'lessons\')">← Усі уроки</button><p class="pill">'+esc(l[0])+'</p><h2>'+(i+1)+'. '+esc(l[1])+'</h2><p>'+esc(l[2])+'</p><h3>Творче завдання</h3><p>'+esc(l[3])+'</p><button class="btn" onclick="openStudio('+i+')">Малювати стилусом</button><h3>Перевір себе</h3><p>'+esc(l[4])+'</p><div class="answers">'+l[5].map((a,j)=>'<button onclick="answer('+i+','+j+')" id="answer'+j+'">'+esc(a)+'</button>').join('')+'</div><p id="feedback"></p><button class="btn" onclick="complete('+i+')">Завершити урок</button></div>'}
function answer(i,j){selection=j;let good=content[i][6]===j;data.tests[i]=good?1:0;save();document.getElementById("feedback").textContent=good?"Правильно!": "Спробуй ще раз: подумай над поясненням уроку.";for(let k=0;k<3;k++)document.getElementById("answer"+k).classList.toggle("selected",k===j)}
function complete(i){data.done[i]=new Date().toISOString();save();tab("lessons")}
function openStudio(i){tab("studio");document.getElementById("workname").value=content[i][1]+" — творча робота"}
function setupPaint(){canvas=document.getElementById("paint");ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,900,650);const palette=["#242137","#6457a6","#d26291","#f2a83a","#2e976d","#1c8acb","#ea513a","#fff"];document.getElementById("colors").innerHTML=palette.map(c=>'<button class="swatch" style="background:'+c+'" aria-label="Колір" onclick="setColor(\''+c+'\')"></button>').join("");canvas.addEventListener("pointerdown",e=>{e.preventDefault();drawing=true;canvas.setPointerCapture(e.pointerId);last=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y)});canvas.addEventListener("pointermove",e=>{if(!drawing)return;e.preventDefault();const p=pos(e);ctx.strokeStyle=color;ctx.lineWidth=Number(document.getElementById("width").value)*(e.pointerType==="pen"&&e.pressure>0?Math.max(.5,e.pressure*1.7):1);ctx.lineCap="round";ctx.lineJoin="round";ctx.lineTo(p.x,p.y);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x,p.y);last=p});canvas.addEventListener("pointerup",()=>drawing=false);canvas.addEventListener("pointercancel",()=>drawing=false)}
function pos(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*900/r.width,y:(e.clientY-r.top)*650/r.height}}function setColor(c){color=c}function clearPaint(){if(confirm("Очистити полотно?")){ctx.fillStyle="#fff";ctx.fillRect(0,0,900,650)}}function undo(){alert("Скасування штриха буде додано пізніше. Зараз можна очистити полотно.")}
function storeWork(){let name=document.getElementById("workname").value.trim()||"Моя робота";data.works.unshift({name,image:canvas.toDataURL("image/jpeg",.65),date:new Date().toLocaleDateString("uk-UA")});save();alert("Роботу збережено в галереї")}
function downloadWork(i){let a=document.createElement("a");a.href=data.works[i].image;a.download="mystetstvo-"+i+".jpg";a.click()}function grade(i,v){if(v)data.grades[i]=Number(v);else delete data.grades[i];save()}
function backup(){let a=document.createElement("a"),blob=new Blob([JSON.stringify(data)],{type:"application/json"});a.href=URL.createObjectURL(blob);a.download="mystetstvo-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.done||!Array.isArray(x.works))throw Error();if(confirm("Замінити поточний прогрес даними копії?")){data=x;save();tab("parent")}}catch(e){alert("Неправильний файл резервної копії")}};r.readAsText(f)}
tab("lessons");
</script><script src="guides.js"></script><script src="illustrations.js"></script><script src="quiz-bank-a.js"></script><script src="quiz-bank-b.js"></script><script src="art-references.js"></script><script src="deep-lessons-a.js"></script><script src="deep-lessons-b.js"></script><script src="deep-lessons-c.js"></script><script src="deep-lessons-ui.js"></script><script src="atelier-v3.js"></script><script src="enhanced.js"></script></body></html>
