name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER" || { echo "Android sdkmanager missing"; exit 1; }
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Install artwork image optimizer
        run: npm install --no-save --no-package-lock sharp --no-audit --no-fund
      - name: Fetch and verify public-domain artworks and archival photographs
        run: node scripts/fetch-open-images.mjs
      - name: Validate scripts and all creative exercises
        run: node scripts/check-app.mjs && node scripts/check-curriculum.mjs && node scripts/check-atelier-v3.mjs && node scripts/check-deep-art.mjs && node scripts/check-open-museum.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create Android project
        run: npx cap add android
      - name: Sync project
        run: npx cap sync android
      - name: Set custom Atelier launcher icon
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_viktoria_atelier.xml <<'ICON'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#F44F88" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#FFE66D" android:pathData="M18,20h16l20,55l20,-55h16l-27,69h-18z"/>
            <path android:fillColor="#3FD3C4" android:pathData="M14,91m-6,0a6,6 0,1 0,12 0a6,6 0,1 0,-12 0"/>
          </vector>
          ICON
          sed -i 's#@mipmap/ic_launcher_round#@drawable/ic_viktoria_atelier#g; s#@mipmap/ic_launcher#@drawable/ic_viktoria_atelier#g' android/app/src/main/AndroidManifest.xml
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: mystetstvo-bachyty-samsung
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload source snapshot for QA
        uses: actions/upload-artifact@v4
        with:
          name: mystetstvo-app-source
          path: www/
      - name: Publish APK for direct download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk mystetstvo-bachyty.apk
          if gh release view android-preview >/dev/null 2>&1; then
            gh release upload android-preview mystetstvo-bachyty.apk --clobber
          else
            gh release create android-preview mystetstvo-bachyty.apk --title "Вікторія DinLova — APK" --notes "Попередня тестова версія Android для Samsung Galaxy Tab (debug APK)." --prerelease
          fi
